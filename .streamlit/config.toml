[theme]
base = "dark"
primaryColor = "#D4A855"
backgroundColor = "#0B0F1A"
secondaryBackgroundColor = "#161B2E"
textColor = "#EDEBFF"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true

# Desactivado durante el diagnóstico del crash de Windows (torch + chromadb
# fuera del hilo principal, ver src/engine_singleton.py). Ya resuelto vía
# init perezoso en el hilo de Streamlit, seguro en Linux (deploy). Se deja en
# "none" solo porque no se necesita hot-reload en producción; localmente en
# Windows se puede reactivar con --server.fileWatcherType auto si se quiere.
[server]
fileWatcherType = "none"
