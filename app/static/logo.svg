<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="YACHAY">
  <defs>
    <linearGradient id="yachayGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C878"/>
      <stop offset="100%" stop-color="#B8863E"/>
    </linearGradient>
    <linearGradient id="yachayGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDEBFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EDEBFF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="#0B0F1A" stroke="url(#yachayGold)" stroke-width="1.5"/>

  <!-- Rayos andinos abstractos -->
  <g stroke="url(#yachayGold)" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <line x1="32" y1="7" x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="57"/>
    <line x1="7" y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="57" y2="32"/>
    <line x1="14.9" y1="14.9" x2="19.7" y2="19.7"/>
    <line x1="44.3" y1="44.3" x2="49.1" y2="49.1"/>
    <line x1="49.1" y1="14.9" x2="44.3" y2="19.7"/>
    <line x1="19.7" y1="44.3" x2="14.9" y2="49.1"/>
  </g>

  <!-- Nodo central de conocimiento conectado a 3 fuentes (retrieval / grafo) -->
  <g stroke="url(#yachayGlow)" stroke-width="1.4" fill="none">
    <line x1="32" y1="30" x2="22" y2="41"/>
    <line x1="32" y1="30" x2="42" y2="41"/>
    <line x1="32" y1="30" x2="32" y2="45"/>
  </g>
  <circle cx="22" cy="41" r="3.2" fill="#0B0F1A" stroke="url(#yachayGold)" stroke-width="1.4"/>
  <circle cx="42" cy="41" r="3.2" fill="#0B0F1A" stroke="url(#yachayGold)" stroke-width="1.4"/>
  <circle cx="32" cy="45" r="3.2" fill="#0B0F1A" stroke="url(#yachayGold)" stroke-width="1.4"/>
  <circle cx="32" cy="30" r="6.5" fill="url(#yachayGold)"/>
  <circle cx="32" cy="30" r="6.5" fill="none" stroke="#0B0F1A" stroke-width="1"/>
</svg>
